# Render.com deployment configuration
# https://render.com/docs/deploy-flask

services:
  - type: web
    name: what-dawg
    env: python
    buildCommand: pip install -r requirements-prod.txt
    startCommand: gunicorn wsgi:app --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.6
      - key: FLASK_ENV
        value: production
    healthCheckPath: /
    disk:
      name: model-storage
      mountPath: /app/models
      sizeGB: 1
